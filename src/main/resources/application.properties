# ===================================================================
# Configuração Principal - DevShowcase API
# ===================================================================

# Nome da Aplicação
spring.application.name=DevShowcase-api

# Perfil Ativo Padrão (será sobrescrito para 'prod' no Render via SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Configuração da Porta do Servidor (lê a variável PORT injetada pelo Render)
server.port=${PORT:8080}

# ===================================================================
# Configuração de Banco de Dados PostgreSQL (Padrão e Produção)
# ===================================================================

# URL limpa do JDBC sem credenciais embarcadas
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-dasmodjbc2fs73fuqn10-a.virginia-postgres.render.com:5432/dbdevshowcase_1bji}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:mEGhBEB28QozutxrrSSUnQxWnTxPQnd0}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração de JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false